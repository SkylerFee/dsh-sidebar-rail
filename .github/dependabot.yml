version: 2
updates:
  # 固定提交的 Actions 仍需定期更新，由 PR 保留审查与 CI 记录。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      # codeql-action 的 init 与 analyze 必须同版本：init 会把自身版本写进配置
      # 文件，analyze 启动时校验「配置版本 == 运行版本」，不一致就整条 job 失败
      # （实测报错：Loaded a configuration file for version '4.39.3', but
      # running version '3.39.3'）。dependabot 默认按 action 拆成多个 PR，单独
      # 合并任一个都会红，因此把它们放进同一个组，一次提交齐。
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      development-patch-and-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major 版本跳跃一律不自动提 PR。本项目的依赖与宿主强相关：
      # react / react-dom 在构建里是 external，实际实现由宿主注入；typescript
      # 的 major 会改变类型检查行为。这类升级需要人工判断兼容性并单独验证，
      # 不适合依赖 CI 绿灯直接合入（此前 React 18→19 的 PR 就卡在 Install）。
      #
      # 只忽略 major，minor 与 patch 仍会提 PR —— 否则会冻结在某个补丁版本，
      # 错过同一主线内的安全修复。
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
