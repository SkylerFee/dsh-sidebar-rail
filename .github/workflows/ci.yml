name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 迁移后仓库有开发依赖（TypeScript / esbuild / tsx / React 类型），但**运行时**
      # 依赖仍为零。用 npm ci 按 package-lock.json 精确安装，再跑完整 check：
      # typecheck → 源码规则 → 单测 → build → 产物规则 → 产物测试。
      - name: Install
        run: npm ci

      - name: Check
        run: npm run check
