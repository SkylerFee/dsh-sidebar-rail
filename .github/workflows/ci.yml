name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The package has no dependencies and no build step, so there is nothing
      # to install: `check` is syntax validation on both entries plus the tests.
      - name: Check
        run: npm run check
