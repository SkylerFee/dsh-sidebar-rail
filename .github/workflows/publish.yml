name: Publish to npm

# npm Trusted Publisher 必须绑定 npm-publish 环境；发布审批在任何 OIDC 步骤前完成。
on:
  release:
    types: [published]

permissions:
  contents: read

# 所有版本串行发布，取消旧任务可能截断已经进行中的上传，因此不自动取消。
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      dist-tag: ${{ steps.package.outputs.distTag }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify release identity and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          node scripts/release-policy.mjs
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::发布提交不属于 main 历史'
            exit 1
          fi

      # 构建所在的 runner 没有 OIDC 权限；安装脚本和测试不会接触发布身份。
      - name: Install and check
        run: |
          npm ci
          npm run check

      - name: Pack and inspect the final artifact
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}/release" > "${RUNNER_TEMP}/pack.json"
          node <<'NODE'
          const { readFileSync, renameSync } = require('node:fs');
          const { join } = require('node:path');
          const packed = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'pack.json'), 'utf8'));
          if (packed.length !== 1 || !/^[a-zA-Z0-9.-]+\.tgz$/.test(packed[0].filename)) {
            throw new Error('打包结果必须恰好包含一个普通 tarball');
          }
          renameSync(join(process.env.RUNNER_TEMP, 'release', packed[0].filename), join(process.env.RUNNER_TEMP, 'release', 'package.tgz'));
          NODE
          node scripts/release-policy.mjs "${RUNNER_TEMP}/release/package.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # 这个 runner 不 checkout、不安装项目依赖，也不执行制品或仓库脚本。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/release

      - name: Verify artifact identity and release ordering
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { join } = require('node:path');
          // BEGIN_PUBLISH_GUARD：测试直接执行此段实际发布判定，不执行任何仓库脚本。
          /** 校验包身份与通道，只接受严格版本和一行输出；失败抛错。 */
          function verifyIdentity(manifest, expected) {
            if (manifest.name !== '@skylerfee/dsh-sidebar-rail') throw new Error('发布包名不符');
            if (typeof manifest.version !== 'string' || manifest.version !== manifest.version.trim()) throw new Error('制品版本包含首尾空白');
            const matched = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(manifest.version);
            if (!matched) throw new Error('制品版本不是严格 SemVer');
            const identifiers = matched[4]?.split('.') ?? [];
            if (identifiers.some(part => /^\d+$/.test(part) && part.length > 1 && part.startsWith('0'))) throw new Error('预发布数字标识带前导零');
            const prerelease = identifiers.length > 0;
            if (!['true', 'false'].includes(expected.prerelease) || (expected.prerelease === 'true') !== prerelease) throw new Error('Release 预发布标志不符');
            const distTag = identifiers[0] ?? 'latest';
            if (prerelease && (!/^[a-z][a-z0-9-]*$/.test(distTag) || distTag === 'latest')) throw new Error('不安全的预发布通道');
            if (manifest.version !== expected.version || expected.releaseTag !== `v${manifest.version}` || expected.distTag !== distTag) throw new Error('制品版本、标签或通道不符');
            return { version: manifest.version, distTag, stable: !prerelease };
          }
          /** 按稳定版本三元组比较，使用 BigInt 避免字典序和大整数精度错误。 */
          function assertForwardVersion(version, latest) {
            const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            if (typeof version !== 'string' || typeof latest !== 'string' || version !== version.trim() || latest !== latest.trim() || !pattern.test(version) || !pattern.test(latest)) throw new Error('稳定通道的版本元数据不合法');
            const proposed = version.split('.').map(BigInt);
            const current = latest.split('.').map(BigInt);
            for (let index = 0; index < 3; index += 1) {
              if (proposed[index] > current[index]) return;
              if (proposed[index] < current[index]) throw new Error('拒绝将 latest 回退到旧版本');
            }
            throw new Error('拒绝重复发布当前 latest 版本');
          }
          /** 读取固定 registry 的 JSON；仅 404 表示不存在，网络或其他响应失败时终止。 */
          async function registryMetadata(suffix) {
            const response = await fetch(`https://registry.npmjs.org/@skylerfee%2fdsh-sidebar-rail/${suffix}`, { signal: AbortSignal.timeout(15000), redirect: 'error' });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`registry 元数据请求失败：${response.status}`);
            return response.json();
          }
          /** 版本已发布时终止；稳定通道必须比当前 latest 更高。 */
          async function verifyRegistry(identity) {
            if (await registryMetadata(encodeURIComponent(identity.version)) !== null) throw new Error('该版本已在 registry 发布，拒绝重复运行');
            if (identity.stable) {
              const latest = await registryMetadata('latest');
              if (latest !== null) assertForwardVersion(identity.version, latest.version);
            }
          }
          // END_PUBLISH_GUARD
          /** 校验固定 tarball 的哈希与 JSON 元数据，不解包执行其中内容。 */
          async function main() {
            const tarball = join(process.env.RUNNER_TEMP, 'release', 'package.tgz');
            const sha256 = createHash('sha256').update(readFileSync(tarball)).digest('hex');
            if (!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256 ?? '') || sha256 !== process.env.EXPECTED_SHA256) throw new Error('制品 SHA-256 与构建输出不符');
            const manifest = JSON.parse(execFileSync('tar', ['-xOzf', tarball, 'package/package.json'], { encoding: 'utf8' }));
            const identity = verifyIdentity(manifest, { version: process.env.EXPECTED_VERSION, distTag: process.env.EXPECTED_DIST_TAG, releaseTag: process.env.RELEASE_TAG, prerelease: process.env.RELEASE_PRERELEASE });
            await verifyRegistry(identity);
            console.log('[dsh-sidebar-rail] 发布制品与版本顺序已核验', JSON.stringify({ ...identity, sha256 }));
          }
          main().catch(error => { console.error('[dsh-sidebar-rail] 发布校验失败：', error.message); process.exitCode = 1; });
          NODE

      - name: Publish the checked tarball
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "${RUNNER_TEMP}/release/package.tgz" --ignore-scripts --provenance --tag "${DIST_TAG}"

      - name: Confirm the version is visible
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if npm view "@skylerfee/dsh-sidebar-rail@${VERSION}" version > /dev/null 2>&1; then
              echo "[dsh-sidebar-rail] registry 已可见 ${VERSION}"
              exit 0
            fi
            echo "[dsh-sidebar-rail] 等待 registry 索引 ${attempt}/30"
            sleep 10
          done
          echo "::warning::发布上传成功，但 registry 尚未索引；请核实后再宣布发布完成"
